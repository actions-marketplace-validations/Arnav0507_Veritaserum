name: "Veritaserum context drift"
description: "Verify machine-checkable AI context claims and gate newly introduced drift."
author: "Arnav Goel"
branding:
  icon: "check-circle"
  color: "purple"
inputs:
  repo:
    description: "Repository-relative path to check."
    required: false
    default: "."
  config:
    description: "Repository-relative config path; auto-detected when empty."
    required: false
    default: ""
  fail-on-drift:
    description: "Fail when a new gating violation is found."
    required: false
    default: "true"
  sarif-file:
    description: "Path for the generated SARIF report."
    required: false
    default: "veritaserum.sarif"
outputs:
  failed:
    description: "Whether new drift crossed the configured severity gate."
    value: ${{ steps.check.outputs.failed }}
  exit-code:
    description: "Veritaserum exit code (0 pass, 1 drift, 2 configuration error)."
    value: ${{ steps.check.outputs.exit-code }}
  sarif-file:
    description: "The SARIF path supplied to the action."
    value: ${{ inputs.sarif-file }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Veritaserum
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$ACTION_PATH"
    - name: Check context claims
      id: check
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL: ${{ inputs.fail-on-drift }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_SARIF: ${{ inputs.sarif-file }}
      run: |
        if [[ "$INPUT_FAIL" != "true" && "$INPUT_FAIL" != "false" ]]; then
          echo "::error::fail-on-drift must be 'true' or 'false'"
          exit 2
        fi

        args=(check --repo "$INPUT_REPO" --format human --sarif-output "$INPUT_SARIF")
        if [[ -n "$INPUT_CONFIG" ]]; then
          args+=(--config "$INPUT_CONFIG")
        fi

        set +e
        veritaserum "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/veritaserum.txt"
        rc=${PIPESTATUS[0]}
        set -e

        {
          echo "## Veritaserum context drift"
          echo '```text'
          cat "$RUNNER_TEMP/veritaserum.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        if [[ "$rc" -eq 1 ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
        else
          echo "failed=false" >> "$GITHUB_OUTPUT"
        fi

        if [[ "$rc" -eq 2 || ("$rc" -eq 1 && "$INPUT_FAIL" == "true") ]]; then
          exit "$rc"
        fi
