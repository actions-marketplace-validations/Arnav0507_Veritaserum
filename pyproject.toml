[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritaserum"
version = "0.1.0"
description = "Testable AI instructions: verify AI context files against live code, in CI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
veritaserum = "veritaserum.cli:main"

[tool.setuptools]
packages = ["veritaserum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
