[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veritaserum"
version = "0.3.0"
description = "Testable AI instructions: verify AI context files against live code, in CI."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Arnav Goel" }]
keywords = ["ai", "ci", "github-actions", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/Arnav0507/veritaserum"
Issues = "https://github.com/Arnav0507/veritaserum/issues"

[project.scripts]
veritaserum = "veritaserum.cli:main"

[tool.setuptools]
packages = ["veritaserum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
