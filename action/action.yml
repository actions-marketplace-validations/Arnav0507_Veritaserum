name: "Veritaserum — AI Context Drift Check"
description: "Verify AI context files (AGENTS.md, copilot-instructions.md, CLAUDE.md, Cursor rules) against the live code. Gates PRs on new drift."
branding:
  icon: "check-circle"
  color: "purple"
inputs:
  repo:
    description: "Path to the repository root to check."
    required: false
    default: "."
  config:
    description: "Path to .veritaserum.yml (auto-detected if omitted)."
    required: false
    default: ""
  fail-on-drift:
    description: "Fail the job when new drift is found (true) or only annotate (false)."
    required: false
    default: "true"
  sarif-file:
    description: "Where to write the SARIF report for code-scanning annotations."
    required: false
    default: "veritaserum.sarif"
  version:
    description: "Veritaserum version to install from PyPI."
    required: false
    default: "0.1.0"
outputs:
  failed:
    description: "true if new drift gated the build."
    value: ${{ steps.check.outputs.failed }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Veritaserum
      shell: bash
      run: pip install "veritaserum==${{ inputs.version }}"
    - name: Run context drift check
      id: check
      shell: bash
      run: |
        set +e
        CFG=""
        [ -n "${{ inputs.config }}" ] && CFG="--config ${{ inputs.config }}"
        # SARIF for inline PR annotations
        veritaserum check --repo "${{ inputs.repo }}" $CFG \
          --format sarif --output "${{ inputs.sarif-file }}" --warn-only
        # Human summary for the job summary + real exit code
        veritaserum check --repo "${{ inputs.repo }}" $CFG --format human \
          | tee "$RUNNER_TEMP/veritaserum.txt"
        RC=${PIPESTATUS[0]}
        {
          echo "## Veritaserum — AI context drift"
          echo '```'
          cat "$RUNNER_TEMP/veritaserum.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$RC" -ne 0 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
        if [ "${{ inputs.fail-on-drift }}" = "true" ]; then exit $RC; else exit 0; fi
