# Example: add this as .github/workflows/veritaserum.yml in your repo.
name: AI Context Drift
on:
  pull_request:

permissions:
  contents: read
  security-events: write   # required to upload SARIF annotations

jobs:
  context-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify AI context
        id: veritaserum
        uses: Arnav0507/veritaserum@v0.3.0
        with:
          repo: "."
          fail-on-drift: "true"
          sarif-file: "veritaserum.sarif"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check affected claims on PR diff
        run: |
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/Arnav0507/Veritaserum@v0.3.0"
          veritaserum affected --repo . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      # Show drift inline on the PR diff (annotations on the source context file).
      - name: Upload SARIF
        if: always() && hashFiles('veritaserum.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: veritaserum.sarif
